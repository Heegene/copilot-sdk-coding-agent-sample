name: 🔧 CI Fix Agent (Master)

on:
  workflow_run:
    workflows: ['*']
    types: [completed]
  workflow_call:
    inputs:
      agent_repo:
        description: 'Central agent repo name (owner/repo). Defaults to the repo hosting this workflow.'
        type: string
        required: false
        default: ''
    secrets:
      GH_TOKEN:
        required: true
        # GH_TOKEN is the GHES instance PAT — used for GHES API calls
        # (issues, PRs, git operations).
      COPILOT_GITHUB_TOKEN:
        description: 'Optional: GitHub token for Copilot SDK auth. If not set, runner copilot login credentials are used.'
        required: false

concurrency:
  group: ci-fix-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  ci-fix:
    # Only run on failed workflows from copilot/ branches
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'copilot/')
    runs-on: self-hosted
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: 🐍 Setup Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: 📥 Fetch Agent Code
        id: agent-code
        run: |
          GHES_HOST=$(echo "${{ github.server_url }}" | sed 's|https://||')
          AGENT_REPO="${{ inputs.agent_repo || github.repository }}"
          AGENT_REPO_DIR="${RUNNER_TEMP}/agent-repo"
          rm -rf "$AGENT_REPO_DIR"
          git clone --depth 1 "https://x-access-token:${{ secrets.GH_TOKEN }}@${GHES_HOST}/${AGENT_REPO}.git" "$AGENT_REPO_DIR"
          REQUIREMENTS_HASH=$(sha256sum "$AGENT_REPO_DIR/requirements.txt" | awk '{print $1}')
          echo "requirements_hash=$REQUIREMENTS_HASH" >> "$GITHUB_OUTPUT"

      - name: 💾 Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-agent-pip-${{ steps.setup-python.outputs.python-version }}-${{ steps.agent-code.outputs.requirements_hash }}
          restore-keys: |
            ${{ runner.os }}-agent-pip-${{ steps.setup-python.outputs.python-version }}-
            ${{ runner.os }}-agent-pip-

      - name: 📦 Install Agent Dependencies
        run: |
          VENV_DIR="${RUNNER_TEMP}/agent-venv"
          rm -rf "$VENV_DIR"
          if ! python3 -m venv "$VENV_DIR"; then
            PY_VER=$(python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
            sudo apt-get update
            sudo apt-get install -y "python${PY_VER}-venv" 2>/dev/null || sudo apt-get install -y python3-venv
            rm -rf "$VENV_DIR"
            python3 -m venv "$VENV_DIR"
          fi
          "$VENV_DIR/bin/python" -m ensurepip --upgrade
          "$VENV_DIR/bin/python" -m pip install --upgrade --quiet pip setuptools wheel
          "$VENV_DIR/bin/python" -m pip install --quiet -r "${RUNNER_TEMP}/agent-repo/requirements.txt"

      - name: 🔐 Configure Git & GitHub CLI
        run: |
          GHES_HOST=$(echo "${{ github.server_url }}" | sed 's|https://||')
          git config --global credential.helper '!f() { echo "password=${GH_TOKEN}"; }; f'
          git config --global user.name "copilot-agent[bot]"
          git config --global user.email "copilot-agent[bot]@users.noreply.github.com"
          gh auth login --hostname "${GHES_HOST}" --with-token <<< "${{ secrets.GH_TOKEN }}"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: 📋 Fetch Failed Run Details
        id: failure-info
        run: |
          GHES_HOST=$(echo "${{ github.server_url }}" | sed 's|https://||')
          if [[ "$GHES_HOST" == "github.com" ]]; then
            API_BASE="https://api.github.com"
          else
            API_BASE="https://$GHES_HOST/api/v3"
          fi

          RUN_ID="${{ github.event.workflow_run.id }}"
          REPO="${{ github.repository }}"

          # Get failed jobs and their logs
          JOBS=$(curl -s -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            "${API_BASE}/repos/${REPO}/actions/runs/${RUN_ID}/jobs" \
            | python -c "
          import json, sys
          data = json.load(sys.stdin)
          failed = [j for j in data.get('jobs', []) if j['conclusion'] == 'failure']
          for j in failed:
              print(f\"Job: {j['name']} (ID: {j['id']})\")
              for s in j.get('steps', []):
                  if s.get('conclusion') == 'failure':
                      print(f\"  Failed step: {s['name']}\")
          ")

          echo "failed_jobs<<EOF" >> "$GITHUB_OUTPUT"
          echo "$JOBS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "branch=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: 🔧 Run CI Fix Agent
        timeout-minutes: 30
        run: PYTHONPATH="${RUNNER_TEMP}/agent-repo:$PYTHONPATH" "${RUNNER_TEMP}/agent-venv/bin/python" -m agent.orchestrator --mode ci-fix
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: "workflow_run"
          FAILED_RUN_ID: ${{ steps.failure-info.outputs.run_id }}
          FAILED_BRANCH: ${{ steps.failure-info.outputs.branch }}
          FAILED_JOBS: ${{ steps.failure-info.outputs.failed_jobs }}

      - name: 📦 Upload Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-fix-logs-${{ github.run_id }}
          path: logs/
          retention-days: 30
